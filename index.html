<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مراجعة مقدمة في الإدارة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ea; --card:#ffffff; --ink:#1d2b2a; --soft:#5d6b69; --line:#e2ddd1;
  --main:#0f6b5f; --main2:#0b4f47; --tint:#e3f1ee; --amber:#e9a13b; --amber-t:#fdf1dc;
  --ok:#1f9d62; --ok-t:#e1f6ea; --no:#d2483f; --no-t:#fde8e6; --shadow:0 6px 20px rgba(20,40,38,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1716; --card:#18231f; --ink:#e9efed; --soft:#9fb0ac; --line:#2a3833;
    --main:#3dbfa9; --main2:#7fdcca; --tint:#17302b; --amber:#f0b45a; --amber-t:#33290f;
    --ok:#46c98a; --ok-t:#14301f; --no:#f0766d; --no-t:#3a1a18; --shadow:0 6px 20px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,"Segoe UI",Tahoma,system-ui,sans-serif;font-size:17px;line-height:1.75;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:var(--main);color:#fff;padding:10px 16px 0;box-shadow:0 2px 12px rgba(0,0,0,.18)}
@media (prefers-color-scheme: dark){.top{background:#0c3c36}}
.top h1{margin:0;font-size:18px;font-weight:900;display:flex;justify-content:space-between;align-items:center;gap:8px}
.top h1 small{font-weight:500;font-size:13px;opacity:.9;white-space:nowrap}
.bar{height:7px;background:rgba(255,255,255,.25);border-radius:9px;margin:8px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--amber);border-radius:9px;transition:width .5s}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:rgba(255,255,255,.14);color:#fff;padding:7px 13px;border-radius:99px;font-size:14px;font-weight:700;white-space:nowrap}
.tab.on{background:#fff;color:#0b4f47}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 90px}
.hero{background:linear-gradient(135deg,var(--main),#14897a);color:#fff;border-radius:22px;padding:22px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
@media (prefers-color-scheme: dark){.hero{background:linear-gradient(135deg,#0c3c36,#14695d)}}
.hero:after{content:"";position:absolute;inset-inline-end:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.09)}
.hero h2{margin:0 0 6px;font-size:25px;font-weight:900;line-height:1.4}
.hero p{margin:0;opacity:.95}
.name{margin-top:14px;display:flex;gap:8px}
.name input{flex:1;min-width:0;border:0;border-radius:12px;padding:10px 12px;font:inherit;background:rgba(255,255,255,.95);color:#1d2b2a}
h3.sec{font-size:20px;font-weight:900;margin:26px 0 10px;display:flex;align-items:center;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:var(--shadow);animation:rise .4s both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card h4{margin:0 0 8px;font-size:18.5px;font-weight:900;color:var(--main2);display:flex;gap:8px;align-items:baseline}
.card h4 .n{flex:0 0 auto;background:var(--main);color:#fff;width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:14px}
@media (prefers-color-scheme: dark){.card h4 .n{color:#06201c}}
.card ul{margin:6px 0;padding-inline-start:20px}
.card li{margin:3px 0}
.card p{margin:6px 0}
b.k{background:var(--amber-t);padding:0 5px;border-radius:6px;font-weight:700}
.tip{background:var(--amber-t);border-inline-start:5px solid var(--amber);border-radius:12px;padding:9px 12px;margin:10px 0 4px;font-weight:500}
.tip:before{content:"💡 حيلة الحفظ: ";font-weight:900}
.ex{background:var(--tint);border-radius:12px;padding:9px 12px;margin:8px 0}
.ex:before{content:"🧃 مثال من حياتك: ";font-weight:900}
table.t{width:100%;border-collapse:collapse;margin:8px 0;font-size:15.5px}
table.t td,table.t th{border:1px solid var(--line);padding:7px 8px;text-align:start;vertical-align:top}
table.t th{background:var(--tint);font-weight:900}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.flow span{background:var(--tint);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-weight:700;font-size:15px}
.flow i{font-style:normal;color:var(--soft)}
.q{border-top:1px dashed var(--line);margin-top:14px;padding-top:12px}
.q .qt{font-weight:700;margin-bottom:8px}
.q .qt:before{content:"❓ "}
.opts{display:grid;gap:8px}
.opts.tf{grid-template-columns:1fr 1fr}
.opt{background:var(--bg);border:2px solid var(--line);border-radius:13px;padding:10px 12px;text-align:start;font-weight:500;transition:transform .12s,background .2s,border-color .2s}
.opt:active{transform:scale(.98)}
.opt.ok{background:var(--ok-t);border-color:var(--ok);font-weight:700}
.opt.no{background:var(--no-t);border-color:var(--no);animation:shake .35s}
.opt:disabled{cursor:default}
.q.lock .opt:not(.ok):not(.no){opacity:.55}
@keyframes shake{25%{transform:translateX(6px)}50%{transform:translateX(-6px)}75%{transform:translateX(4px)}}
.why{margin-top:8px;padding:9px 12px;border-radius:12px;background:var(--ok-t);font-size:16px}
.why.bad{background:var(--amber-t)}
.again{margin-top:6px;color:var(--no);font-weight:700;font-size:15px}
details.r{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:8px 0;padding:0 14px}
details.r summary{padding:12px 0;font-weight:700;cursor:pointer;list-style:none}
details.r summary:before{content:"✍️ "}
details.r summary::-webkit-details-marker{display:none}
details.r div{padding:0 0 12px;border-top:1px dashed var(--line);padding-top:10px}
.plan{counter-reset:p;list-style:none;padding:0;margin:0}
.plan li{counter-increment:p;display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line)}
.plan li:last-child{border:0}
.plan li:before{content:counter(p);flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--amber);color:#3a2706;display:grid;place-items:center;font-weight:900;font-size:14px;margin-top:3px}
.plan small{color:var(--soft);display:block}
.go{display:block;width:100%;border:0;background:var(--main);color:#fff;border-radius:14px;padding:13px;font-weight:900;font-size:17px;margin-top:12px;box-shadow:var(--shadow)}
@media (prefers-color-scheme: dark){.go{color:#06201c}}
.go.alt{background:var(--amber);color:#3a2706}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fc{perspective:900px;height:170px;border:0;background:none;padding:0}
.fc .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.f .in{transform:rotateY(180deg)}
.fc .s{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;text-align:center;padding:10px;box-shadow:var(--shadow);border:1px solid var(--line)}
.fc .a{background:var(--main);color:#fff;font-weight:900;font-size:19px}
@media (prefers-color-scheme: dark){.fc .a{background:#14695d}}
.fc .a small{display:block;font-weight:500;font-size:12.5px;opacity:.85;margin-top:6px}
.fc .b{background:var(--card);transform:rotateY(180deg);font-size:14.5px;line-height:1.55;font-weight:500}
.kw{display:grid;grid-template-columns:1fr auto 1fr;gap:6px 8px;align-items:center;font-size:15.5px}
.kw div{padding:6px 9px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.kw div:nth-child(3n){background:var(--tint);font-weight:900}
.kw i{font-style:normal;color:var(--soft)}
.score{text-align:center}
.score .big{font-size:58px;font-weight:900;color:var(--main2);line-height:1.2}
.pill{display:inline-block;padding:3px 11px;border-radius:99px;background:var(--tint);font-weight:700;font-size:14px;margin:3px}
.pill.w{background:var(--no-t)}
.mq-head{display:flex;justify-content:space-between;color:var(--soft);font-weight:700;font-size:14.5px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,80px);background:#16302c;color:#fff;padding:10px 18px;border-radius:99px;font-weight:700;transition:transform .35s;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.3);white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{transform:translate(-50%,0)}
.cf{position:fixed;top:-12px;width:9px;height:14px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.foot{color:var(--soft);font-size:13.5px;text-align:center;margin-top:26px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media print{.top,.go,.toast{display:none}.card{box-shadow:none;break-inside:avoid}}
</style>
</head>
<body>
<header class="top">
  <h1><span>📘 مقدمة في الإدارة</span><small id="pct">0%</small></h1>
  <div class="bar"><i id="bar"></i></div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main class="wrap" id="view"></main>
<div class="toast" id="toast"></div>

<script>
/* ===================== CONTENT ===================== */
var F=["التخطيط","التنظيم","القيادة","الرقابة"];
var LV=["الإدارة العليا","الإدارة الوسطى","الإدارة الدنيا (الإشرافية)","الكوادر الإدارية"];
var TY=["مدراء الخطوط","الكوادر الإدارية","مدراء الوظائف الرئيسة","المدراء العامون"];
var RO=["الأدوار التفاعلية","الأدوار المعلوماتية","الأدوار القرارية","الأدوار الفنية"];
var SK=["المهارات الفنية","المهارات الإنسانية","المهارات الإدراكية","المهارات اللغوية"];
var PE=["الفاعلية","الكفاءة","الإنتاجية","الربحية"];
var OR=["منظمات الأعمال","المنظمات الحكومية","المؤسسات الحكومية","المنظمات الدولية","منظمات المجتمع المدني غير الهادفة للربح","التعاونيات"];
var SC=["فريدريك تايلور","هنري فايول","ماكس ويبر","ألتون مايو","إبراهام ماسلو","دوغلاس ماك جريجور","كريس آرجرس","تشستر برنارد","ماري باركر فوليت","فرانك وليليان جلبرث"];
var SH=["المدرسة الكلاسيكية","المدرسة السلوكية","المدرسة الكمية","مدخل النظم","المدخل الموقفي"];
var EN=["البيئة الداخلية","البيئة الخارجية الخاصة","البيئة الخارجية العامة","البيئة الدولية فقط"];
var CO=["التأكد التام","المخاطرة","عدم التأكد","الإبهام (الغموض التام)"];
var MO=["النموذج التقليدي (الكلاسيكي)","النموذج السلوكي","النموذج السياسي","النموذج الكمي"];
var ST=["إدراك متطلبات القرار","تشخيص وتحليل الأسباب","تطوير البدائل","تقييم البدائل","اختيار البديل المناسب","تنفيذ البديل المختار","التقييم والتغذية العكسية","إجراء التصحيحات أو إقرار النتائج وتوثيقها"];
/* P(set,i,n): correct = set[i], plus up to 3 other items of the set */
function P(set,i,skip){var o=[set[i]];for(var k=0;k<set.length&&o.length<4;k++){if(k!==i&&(!skip||skip.indexOf(k)<0))o.push(set[k]);}return o;}

var CH=[
{id:"c1",tab:"الفصل 1",name:"مفاهيم الإدارة",icon:"🏢",secs:[
 {t:"ما هي الإدارة؟",h:`
  <p>الإدارة ببساطة: <b class="k">نأخذ موارد ← نشتغل عليها بأربع وظائف ← نطلّع منتجات ونحقق الأهداف</b>.</p>
  <ul>
   <li><b>الموارد (4):</b> مادية، مالية، بشرية، معلوماتية.</li>
   <li><b>الوظائف (4):</b> تخطيط، تنظيم، قيادة، رقابة.</li>
   <li><b>المنتجات (3):</b> سلع، خدمات، أفكار.</li>
   <li>الإدارة <b>علم</b> (فيها مفاهيم ومبادئ ونظريات تُدرَّس) و<b>فن</b> (تعتمد على مهارة الشخص عند التطبيق).</li>
   <li>مهمة الإدارة الأساسية: أن تحقق المنظمة <b>أداءً عاليًا</b> باستخدام أفضل للموارد.</li>
  </ul>
  <div class="ex">البقالة: المحل والبضاعة (مادية)، الفلوس (مالية)، العامل (بشرية)، معرفة أسعار السوق (معلوماتية).</div>
  <div class="tip">علم = يُدرَّس في الجامعة. فن = مهارتك وأنت تطبّق.</div>`,
  q:[
   ["mc","الإدارة «علم» لأنها:",["تحتوي على مفاهيم ومبادئ ونظريات تُدرَّس","تعتمد على مهارة الفرد عند التطبيق","لا تحتاج إلى دراسة","خاصة بالشركات الكبيرة فقط"],"علم = مفاهيم ونظريات تُدرَّس. أما الاعتماد على المهارة عند التطبيق فهذا معنى «فن»."],
   ["mc","أي مما يلي <u>ليس</u> من موارد المنظمة؟",["السلع والخدمات","الموارد المادية","الموارد البشرية","الموارد المعلوماتية"],"السلع والخدمات والأفكار هي المنتجات (المخرجات)، وليست موارد."],
   ["tf","المهمة الأساسية للإدارة هي جعل المنظمة تحقق أداءً عاليًا باستخدام أفضل للموارد.",true,"هذا نص المقدمة في الفصل الأول."]
  ]},
 {t:"وظائف الإدارة الأربع",h:`
  <table class="t"><tr><th>الوظيفة</th><th>الكلمة المفتاحية</th></tr>
   <tr><td><b>التخطيط</b></td><td>تحديد <b class="k">الأهداف</b> وما نحتاجه لإنجازها</td></tr>
   <tr><td><b>التنظيم</b></td><td><b class="k">تقسيم وتوزيع</b> الأعمال، إنشاء الأقسام والتنسيق بينها</td></tr>
   <tr><td><b>القيادة</b></td><td><b class="k">التأثير</b> في الآخرين و<b class="k">تحفيزهم</b></td></tr>
   <tr><td><b>الرقابة</b></td><td><b class="k">قياس</b> الأداء الفعلي و<b class="k">مقارنته</b> بالمخطط، ومعالجة الانحرافات</td></tr>
  </table>
  <div class="ex">رحلة بر مع الشباب: تحدد وين ومتى (تخطيط)، توزّع من يجيب الأكل ومن يسوق (تنظيم)، تحمّسهم (قيادة)، تتأكد أن كل شيء مشى مثل ما اتفقتم (رقابة).</div>
  <div class="tip">الترتيب: خطّط ← نظّم ← قُد ← راقب.</div>`,
  q:[
   ["mc","عملية تحديد الأهداف والأفعال والمواد اللازمة لإنجازها هي:",P(F,0),"كلمة «تحديد الأهداف» = التخطيط دائمًا."],
   ["mc","قياس الأداء الفعلي ومقارنته بالأداء المخطط ومعالجة الانحرافات:",P(F,3),"قياس + مقارنة + انحرافات = الرقابة."],
   ["mc","التأثير في الآخرين وتحفيزهم وإثارة قدراتهم لتحقيق الأهداف:",P(F,2),"تأثير + تحفيز = القيادة."],
   ["mc","تقسيم وتوزيع الأعمال وإنشاء الإدارات والأقسام والتنسيق بينها:",P(F,1),"تقسيم + توزيع + أقسام = التنظيم."]
  ]},
 {t:"المدير ومستويات المدراء",h:`
  <p><b>المدير:</b> الشخص المسؤول عن أعمال آخرين في الوحدة التي يرأسها، ويقدّم لهم الدعم.</p>
  <table class="t"><tr><th>المستوى</th><th>اعرفه من</th></tr>
   <tr><td><b>العليا</b></td><td>«<b class="k">الرأس للجسد</b>»، يقودون المنظمة كلها. مثل: المدير التنفيذي، الرئيس، نائب الرئيس</td></tr>
   <tr><td><b>الوسطى</b></td><td>الأقسام والإدارات الرئيسية، فرق العمل، المشاريع، <b class="k">الخطط التكتيكية</b></td></tr>
   <tr><td><b>الدنيا (الإشرافية)</b></td><td><b class="k">المشرفون / الملاحظون</b>، يشرفون مباشرة على موظفين لا يمارسون الإدارة</td></tr>
  </table>
  <div class="tip">هرم: فوق الرئيس، في الوسط مدير القسم، تحت المشرف.</div>`,
  q:[
   ["mc","«هم بمثابة الرأس للجسد» وصف لمدراء:",P(LV,0),"الرأس = الإدارة العليا التي تقود أداء المنظمة الشامل."],
   ["mc","المشرفون أو الملاحظون يتبعون:",P(LV,2),"الإدارة الدنيا تسمى الإشرافية، وأصحابها يسمّون مشرفين أو ملاحظين."],
   ["mc","تطوير الخطط التكتيكية وقيادة الأقسام الرئيسية وإدارة المشاريع من عمل:",P(LV,1),"تكتيكية + أقسام + مشاريع = الإدارة الوسطى."]
  ]},
 {t:"أنواع المدراء (4)",h:`
  <ul>
   <li><b>مدراء الخطوط:</b> يساهمون <b class="k">مباشرة</b> في إنتاج السلعة أو الخدمة.</li>
   <li><b>الكوادر الإدارية:</b> أصحاب <b class="k">خبرات فنية تخصصية</b> يدعمون العاملين في الخطوط.</li>
   <li><b>مدراء الوظائف الرئيسة:</b> مسؤولون عن <b class="k">مجال واحد محدد</b>، مثل مدير الإنتاج أو مدير التسويق.</li>
   <li><b>المدراء العامون:</b> مسؤولون عن وحدة فيها <b class="k">عدة وظائف</b>، مثل مدير المصنع.</li>
  </ul>
  <div class="tip">مجال واحد = وظائف رئيسة. عدة وظائف = عام (مدير المصنع).</div>`,
  q:[
   ["mc","مدير المصنع مثال على:",P(TY,3),"المصنع فيه عدة وظائف (إنتاج، مالية، أفراد…) فمديره مدير عام."],
   ["mc","مدير التسويق أو مدير الإنتاج مثال على:",P(TY,2),"مسؤول عن مجال واحد محدد = مدير وظيفة رئيسة."],
   ["mc","مدراء يساهمون مباشرة في إنتاج السلعة أو الخدمة:",P(TY,0),"كلمة «مباشرة بالإنتاج» = مدراء الخطوط."]
  ]},
 {t:"أدوار المدراء (3)",h:`
  <table class="t"><tr><th>الدور</th><th>معناه</th><th>أمثلة</th></tr>
   <tr><td><b>تفاعلية</b></td><td>تعامله مع <b class="k">الناس</b></td><td>ممثل للمنظمة، قائد، حلقة وصل</td></tr>
   <tr><td><b>معلوماتية</b></td><td>تبادل <b class="k">المعلومات</b></td><td>الراصد، المراسل، الناطق الرسمي</td></tr>
   <tr><td><b>قرارية</b></td><td>صنع <b class="k">القرارات</b></td><td>الريادي، معالج المشاكل، موزع الموارد، المفاوض</td></tr>
  </table>
  <div class="tip">ناس ← تفاعلية. أخبار ← معلوماتية. حسم ← قرارية.</div>`,
  q:[
   ["mc","الراصد والمراسل والناطق الرسمي أدوار:",P(RO,1),"كلها تدور حول نقل المعلومات."],
   ["mc","المفاوض وموزع الموارد ومعالج المشاكل أدوار:",P(RO,2),"كلها فيها اتخاذ قرار."],
   ["mc","ممثل المنظمة والقائد وحلقة الوصل أدوار:",P(RO,0),"كلها تعامل مع الآخرين = تفاعلية."]
  ]},
 {t:"مهارات المدراء (3)",h:`
  <p><b>المهارة:</b> القدرة على تحويل المعرفة إلى أفعال ذات أداء متميز.</p>
  <ul>
   <li><b>الفنية:</b> استخدام المعرفة والخبرة لأداء <b class="k">مهام محددة</b>.</li>
   <li><b>الإنسانية:</b> <b class="k">التعامل مع الآخرين</b> والعمل معهم بشكل جيد.</li>
   <li><b>الإدراكية:</b> <b class="k">التفكير المجرد</b> والتحليلي، والرؤية الشاملة لحل المشاكل المعقدة.</li>
  </ul>
  <table class="t"><tr><th>المستوى</th><th>يحتاج أكثر إلى</th></tr>
   <tr><td>الإدارة العليا</td><td><b>الإدراكية</b></td></tr>
   <tr><td>الإدارة الدنيا</td><td><b>الفنية</b></td></tr>
   <tr><td>كل المستويات</td><td><b>الإنسانية</b> (مهمة للجميع)</td></tr>
  </table>
  <div class="tip">كلما طلعت فوق زاد التفكير (إدراكية)، وكلما نزلت تحت زاد الشغل باليد (فنية).</div>`,
  q:[
   ["mc","القدرة على التفكير المجرد والرؤية الشاملة وحل المشاكل المعقدة:",P(SK,2),"التفكير المجرد والرؤية الشاملة = إدراكية."],
   ["mc","أكثر مهارة تحتاجها الإدارة العليا:",P(SK,2),"الإدارة العليا تفكر في المنظمة كلها، فتحتاج الإدراكية أكثر."],
   ["mc","أكثر مهارة تحتاجها الإدارة الدنيا (الإشرافية):",P(SK,0),"المشرف قريب من العمل نفسه، فيحتاج المهارة الفنية أكثر."],
   ["tf","المهارات الإنسانية مهمة في جميع المستويات الإدارية.",true,"كل مدير يتعامل مع ناس، مهما كان مستواه."]
  ]},
 {t:"سمات المدير الناجح (6)",h:`
  <p>مجموعها يسمى <b class="k">الكفاءة الإدارية</b>:</p>
  <ul>
   <li><b>الاتصال:</b> تبادل الأفكار كتابيًا أو شفهيًا أو حركيًا.</li>
   <li><b>فريق العمل:</b> يعمل كعضو وكقائد، ويبني الاتفاق بين الأعضاء.</li>
   <li><b>إدارة الذات:</b> يقيّم نفسه، يتحلى بالأخلاق، يتحمل المسؤولية.</li>
   <li><b>القيادة:</b> التأثير في الآخرين ودعمهم.</li>
   <li><b>التفكير الناقد المتفتح:</b> يجمع ويحلل المعلومات ليقدم حلولًا مبدعة.</li>
   <li><b>المهنية:</b> الاحترافية، بناء الثقة، التطور الوظيفي المستمر.</li>
  </ul>`,
  q:[
   ["mc","مجموع سمات المدير الناجح يسمى:",["الكفاءة الإدارية","الفاعلية التنظيمية","الإنتاجية","المهارة الفنية"],"السمات الست مجتمعة = الكفاءة الإدارية."],
   ["mc","تقييم الذات وتحمل المسؤولية والتحلي بالأخلاق:",["إدارة الذات","المهنية","الاتصال","فريق العمل"],"كل ما يخص ضبط الشخص لنفسه = إدارة الذات."]
  ]},
 {t:"المنظمة وأنواعها (6)",h:`
  <p><b>المنظمة:</b> كيان قانوني اجتماعي، فيه تقسيم واضح للعمل، يسعى لأهداف مستمرة.</p>
  <table class="t"><tr><th>النوع</th><th>اعرفه من</th></tr>
   <tr><td>منظمات أعمال</td><td>خاصة، هدفها <b class="k">الربح</b></td></tr>
   <tr><td>منظمات حكومية</td><td>خدمات <b class="k">سيادية</b>: الدفاع المدني، الأمن</td></tr>
   <tr><td>مؤسسات حكومية</td><td>سلع وخدمات حتى لا يحتكرها القطاع الخاص: <b class="k">الكهرباء، المياه</b></td></tr>
   <tr><td>منظمات دولية</td><td>على أراضي دول أخرى: السفارات، الأمم المتحدة، اليونسكو</td></tr>
   <tr><td>مجتمع مدني غير هادفة للربح</td><td>أحزاب، حماية المستهلك، حماية البيئة، أطباء بلا حدود</td></tr>
   <tr><td>التعاونيات</td><td>تخدم مجموعة أفراد يملكونها ويديرونها: جمعيات التسويق الزراعي</td></tr>
  </table>`,
  q:[
   ["mc","منظمات خاصة تمارس نشاطًا اقتصاديًا بهدف تحقيق الربح:",P(OR,0),"الربح = منظمات أعمال."],
   ["mc","الدفاع المدني والأمن مثال على:",P(OR,1),"خدمات سيادية تنشئها الدولة = منظمات حكومية."],
   ["mc","الكهرباء والمياه مثال على:",P(OR,2,[0]),"تنتج سلعًا وخدمات حتى لا يحتكرها القطاع الخاص = مؤسسات حكومية."],
   ["mc","أطباء بلا حدود وجمعيات حماية المستهلك مثال على:",P(OR,4,[0]),"خدمات جماهيرية بدون هدف ربح = مجتمع مدني."],
   ["mc","جمعيات التسويق الزراعي مثال على:",P(OR,5,[0,1]),"مجموعة أفراد ينشئونها ويديرونها لخدمتهم = تعاونيات."]
  ]},
 {t:"النظام المفتوح وقياس الأداء",h:`
  <p><b>النظام المفتوح:</b> أجزاء تعمل معًا لتحويل المدخلات إلى مخرجات مفيدة للمجتمع.</p>
  <div class="flow"><span>مدخلات (موارد)</span><i>←</i><span>عمليات تحويلية</span><i>←</i><span>مخرجات (منتجات)</span><i>↩</i><span>تغذية راجعة</span></div>
  <table class="t"><tr><th>المؤشر</th><th>يقيس</th><th>يركز على</th></tr>
   <tr><td><b>الفاعلية</b></td><td>إنجاز <b class="k">الأهداف</b></td><td>المخرجات</td></tr>
   <tr><td><b>الكفاءة</b></td><td>حسن استغلال <b class="k">الموارد</b></td><td>المدخلات</td></tr>
   <tr><td><b>الإنتاجية</b></td><td>المخرجات <b class="k">÷</b> المدخلات</td><td>النسبة</td></tr>
  </table>
  <p>قد تتحقق الفاعلية بدون الكفاءة، والعكس صحيح.</p>
  <div class="ex">وصلت للجامعة في الوقت (فاعلية ✓) لكن بتاكسي غالي (كفاءة ✗).</div>
  <div class="tip">الفاعلية = «فعلت الهدف؟». الكفاءة = «كم كلّفني؟».</div>`,
  q:[
   ["mc","مقياس لمدى إنجاز الأهداف (يركز على المخرجات):",P(PE,0),"أهداف + مخرجات = الفاعلية."],
   ["mc","مقياس لحسن استغلال الموارد (يركز على المدخلات):",P(PE,1),"موارد + مدخلات = الكفاءة."],
   ["mc","نسبة المخرجات إلى المدخلات تسمى:",P(PE,2),"المخرجات ÷ المدخلات = الإنتاجية."],
   ["tf","لا يمكن أن تتحقق الفاعلية بدون الكفاءة.",false,"قد تتحقق الفاعلية دون الكفاءة والعكس صحيح (وصلت للهدف لكن بتكلفة عالية)."],
   ["mc","في النظام المفتوح، ما يرجع من البيئة إلى المنظمة عن مخرجاتها يسمى:",["التغذية الراجعة","المدخلات","العمليات التحويلية","الموارد المالية"],"السهم الراجع في الشكل = التغذية الراجعة."]
  ]},
 {t:"المجتمعات المتطورة والتحديات المعاصرة",h:`
  <p><b>من خصائص المجتمعات المتطورة إداريًا:</b> احترام الوقت، الانفتاح وقبول التجديد، الاستقرار السياسي، المنافسة العادلة، تكافؤ الفرص والعدالة، التفسير الموضوعي وعدم تحميل الآخرين الفشل، علاقة قوية بين الجامعات ومراكز البحوث ومنظمات الأعمال.</p>
  <p><b>التحديات المعاصرة (8):</b></p>
  <ul>
   <li><b>العولمة:</b> تداخل وتقارب عالمي بسبب الاتصالات والمواصلات وزيادة المنافسة.</li>
   <li><b>الاقتصاد المعرفي</b> و<b class="k">رأس المال المعرفي</b>: القوى العقلية والفكرية التي يتقاسمها العاملون.</li>
   <li>النوعية والإنتاجية.</li>
   <li>أخلاقيات العمل والمسؤولية الاجتماعية و<b class="k">الحاكمية المؤسسية</b> (القواعد التي تحكم العلاقات بين أصحاب المصالح).</li>
   <li>التنوع في قوة العمل · البحث والتطوير والإبداع · تخطيط المسار الوظيفي · التكتلات الاقتصادية العالمية.</li>
  </ul>`,
  q:[
   ["mc","تداخل وتقارب عالمي بفعل الاتصالات والمواصلات وزيادة المنافسة:",["العولمة","الحاكمية المؤسسية","رأس المال المعرفي","التعاونيات"],"تعريف العولمة في الفصل الأول."],
   ["mc","مجموع القوى العقلية والفكرية والمعرفية التي يتقاسمها العاملون في المنظمة:",["رأس المال المعرفي","رأس المال المالي","الحاكمية المؤسسية","الكفاءة الإدارية"],"عقلية + فكرية + معرفية = رأس المال المعرفي."],
   ["mc","أي مما يلي من خصائص المجتمعات المتطورة إداريًا؟",["احترام الوقت والالتزام به","تحميل الآخرين مسؤولية الفشل","احتكار السوق","رفض التجديد"],"الخيارات الأخرى عكس خصائص المجتمعات المتطورة."],
   ["mc","القواعد التي تحكم العلاقات بين مختلف أصحاب المصالح تسمى:",["الحاكمية المؤسسية","العولمة","الرقابة","البيروقراطية"],"هذا تعريف الحاكمية المؤسسية."]
  ]}
 ],
 recall:[
  ["عرّف الإدارة.","عمليات ذهنية تظهر في الواقع كممارسات في التخطيط والتنظيم والقيادة والرقابة، وتحوّل الموارد (مادية، مالية، بشرية، معلوماتية) إلى منتجات (سلع، خدمات، أفكار) بشكل فاعل وكفؤ لتحقيق أهداف المنظمة."],
  ["عدّد وظائف الإدارة.","التخطيط، التنظيم، القيادة، الرقابة."],
  ["عدّد مستويات المدراء.","الإدارة العليا، الإدارة الوسطى، الإدارة الدنيا (الإشرافية)."],
  ["عدّد مهارات المدراء.","الفنية، الإنسانية، الإدراكية."],
  ["عدّد أدوار المدراء.","التفاعلية، المعلوماتية، القرارية."],
  ["ما مؤشرات قياس الأداء؟","الفاعلية (إنجاز الأهداف)، الكفاءة (استغلال الموارد)، الإنتاجية (المخرجات ÷ المدخلات)."],
  ["عدّد أنواع المنظمات.","منظمات أعمال، منظمات حكومية، مؤسسات حكومية، منظمات دولية، منظمات مجتمع مدني غير هادفة للربح، تعاونيات."]
 ]},

{id:"c2",tab:"الفصل 2",name:"تطور الإدارة (المدارس)",icon:"🏛️",secs:[
 {t:"خريطة المدارس (احفظها أولًا)",h:`
  <p><b>المدرسة</b> = مجموعة علماء لهم أفكار مشتركة. ليست فترة تاريخية انتهت، وليست مكانًا.</p>
  <table class="t"><tr><th>المدرسة</th><th>فيها</th></tr>
   <tr><td><b>الكلاسيكية</b> (الأقدم)</td><td>الإدارة العلمية · المبادئ الإدارية · البيروقراطية</td></tr>
   <tr><td><b>السلوكية</b></td><td>هوثورن · الحاجات · X و Y · الشخصية الناضجة</td></tr>
   <tr><td><b>الكمية</b></td><td>علم الإدارة (بحوث العمليات)</td></tr>
   <tr><td><b>الحديثة</b></td><td>مدخل النظم · المدخل الموقفي</td></tr>
  </table>
  <div class="tip">الكلاسيكية تهتم بالشغل والنظام. السلوكية تهتم بالإنسان. الكمية تهتم بالأرقام.</div>`,
  q:[
   ["mc","أقدم مدارس الإدارة:",P(SH,0),"الكلاسيكية هي أقدم المدارس."],
   ["mc","أي مما يلي يتبع المدرسة الكلاسيكية؟",["البيروقراطية","نظرية الحاجات الإنسانية","مدخل النظم","بحوث العمليات"],"الكلاسيكية = علمية + مبادئ إدارية + بيروقراطية."],
   ["tf","«المدرسة» في علم الإدارة تعني حقبة تاريخية انتهت.",false,"المدرسة مجموعة علماء بأفكار مشتركة، ولا تعني حقبة منتهية ولا مكانًا محددًا."]
  ]},
 {t:"الإدارة العلمية: تايلور وجلبرث",h:`
  <ul>
   <li><b>فريدريك تايلور:</b> <b class="k">أبو الإدارة العلمية</b> ومؤسس المدرسة الكلاسيكية. كتابه «مبادئ الإدارة العلمية» <b class="k">1911</b>. صاحب دراسة <b class="k">الوقت والحركة</b>.</li>
   <li>يركز على: المنهج العلمي، وزيادة <b>إنتاجية الفرد</b>.</li>
   <li><b>إسهاماته:</b> قواعد علمية لكل وظيفة، اختيار العاملين بعناية، تدريبهم و<b class="k">ربط الأجور بالأداء</b>، مساعدتهم بالتخطيط السليم.</li>
   <li><b>فرانك وليليان جلبرث (زوجان):</b> دراسة الوقت والحركة لتقليل الوقت الضائع، ومهّدا لـ<b class="k">تبسيط العمل</b> والمعيارية.</li>
  </ul>
  <div class="tip">تايلور = Time (الوقت). الاثنان يبدآن بحرف T.</div>`,
  q:[
   ["mc","أبو الإدارة العلمية ومؤسس المدرسة الكلاسيكية:",P(SC,0),"تايلور، صاحب كتاب مبادئ الإدارة العلمية 1911."],
   ["mc","الزوجان اللذان درسا الوقت والحركة ومهّدا لتبسيط العمل:",P(SC,9,[0]),"فرانك وليليان جلبرث."],
   ["mc","أي مما يلي من إسهامات تايلور؟",["ربط الأجور بالأداء","هرم الحاجات","حكم المكاتب","التنظيم غير الرسمي"],"الهرم لماسلو، حكم المكاتب لويبر، التنظيم غير الرسمي لبرنارد."],
   ["mc","الإدارة العلمية تركز على:",["زيادة إنتاجية الفرد بالمنهج العلمي","العلاقات الإنسانية بين العاملين","الأساليب الرياضية والإحصائية","التحالفات بين المديرين"],"الإدارة العلمية = المنهج العلمي + إنتاجية الفرد."]
  ]},
 {t:"المبادئ الإدارية: فايول، فوليت، برنارد",h:`
  <ul>
   <li><b>هنري فايول:</b> كتابه <b class="k">1916</b>. أفكاره قاعدة تخصص إدارة الأعمال. ينظر للمنظمة <b>كوحدة واحدة</b>.</li>
   <li><b>واجبات الإدارة عند فايول (5):</b> الاستبصار (الحكمة)، التنظيم، القيادة، التنسيق، الرقابة.</li>
   <li><b>أنشطة المنظمة (6):</b> فنية وإنتاجية، تجارية، مالية، محاسبية، حماية من المخاطر، إدارية.</li>
   <li><b class="k">المبادئ الأربعة عشر</b>: تقسيم العمل، السلطة والمسؤولية، القواعد المنظمة للعمل، وحدة الأمر، وحدة الاتجاه، خضوع المصلحة الشخصية للعامة، المكافأة العادلة، المركزية، التدرج الهرمي، الترتيب، العدالة، استقرار الكادر، المبادرة، روح الفريق.</li>
   <li><b>المركزية</b> = القرار بيد الإدارة العليا. <b>استقرار الكادر</b> = أقل معدل دوران للعاملين.</li>
   <li><b>ماري باركر فوليت:</b> المنظمة تجمّع يعمل فيه الناس <b class="k">بتناغم ودون هيمنة</b>، والمدير يساعد على التعاون.</li>
   <li><b>تشستر برنارد:</b> <b class="k">التنظيم غير الرسمي</b> + نظرية <b class="k">قبول السلطة</b> (الفرد حر في اتباع الأوامر أو رفضها).</li>
  </ul>
  <div class="tip">فايول = 14 مبدأ. أي سؤال فيه «مبادئ إدارية» أو «14» جوابه فايول.</div>`,
  q:[
   ["mc","صاحب المبادئ الإدارية الأربعة عشر:",P(SC,1),"فايول = 14 مبدأ."],
   ["mc","حصر حق اتخاذ القرار بيد الإدارة العليا يسمى:",["المركزية","وحدة الأمر","التدرج الهرمي","المبادرة"],"تعريف المركزية عند فايول."],
   ["mc","«استقرار الكادر» عند فايول يتحقق من خلال:",["أقل معدل دوران ممكن للعاملين","زيادة ساعات العمل","تقليل الأجور","تغيير المديرين كل سنة"],"استقرار الكادر = العاملون لا يتركون العمل كثيرًا (دوران قليل)."],
   ["mc","صاحب فكرة التنظيم غير الرسمي ونظرية قبول السلطة:",P(SC,7,[0]),"تشستر برنارد."],
   ["mc","رأت أن المنظمة تجمّع يعمل فيه العاملون بتناغم ودون هيمنة:",P(SC,8,[0,1]),"ماري باركر فوليت."]
  ]},
 {t:"البيروقراطية: ماكس ويبر",h:`
  <ul>
   <li><b>ماكس ويبر</b> رائدها. معناها: <b class="k">حكم المكاتب</b>.</li>
   <li>صيغة عقلانية رشيدة تقوم على المنطق والنظام والسلطة الشرعية. ساهمت في تطوير تخصص <b>الإدارة العامة</b>.</li>
   <li><b>مبادئها (6):</b> تقسيم العمل، هيكلية واضحة للسلطة، قواعد وإجراءات رسمية <b class="k">مكتوبة</b>، عدم التحيز، التدرج الوظيفي حسب <b class="k">الجدارة</b>، <b class="k">فصل الإدارة عن الملكية</b>.</li>
  </ul>
  <div class="tip">ويبر = ورق ومكاتب. كل شيء مكتوب ورسمي.</div>`,
  q:[
   ["mc","رائد البيروقراطية:",P(SC,2),"ماكس ويبر."],
   ["mc","البيروقراطية تعني:",["حكم المكاتب","حكم الشعب","حكم الفرد","حكم السوق"],"البيروقراطية = حكم المكاتب."],
   ["mc","أي مما يلي من مبادئ البيروقراطية؟",["فصل الإدارة عن الملكية","هرم الحاجات","الإشراف المشترك","قبول السلطة"],"من مبادئ ويبر: فصل الإدارة عن الملكية، والتدرج حسب الجدارة، والقواعد المكتوبة."]
  ]},
 {t:"المدرسة السلوكية ودراسات هوثورن",h:`
  <ul>
   <li>جاءت <b class="k">ردة فعل على الكلاسيكية</b>. فكرتها: المعاملة الحسنة والرضا والعلاقات ← زيادة الإنتاجية.</li>
   <li>تفترض أن الناس <b>اجتماعيون</b> ويرغبون في تحقيق ذاتهم.</li>
   <li><b>دراسات هوثورن:</b> <b class="k">ألتون مايو</b> وفريق من جامعة هارفارد، <b class="k">1927</b>، مصانع وسترن إلكتريك.</li>
   <li>قارنوا مجموعتين (أ) بظروف مادية جيدة (إضاءة، حرارة) و(ب) بدونها.</li>
   <li><b>النتيجة:</b> الإنتاجية لا تحكمها الظروف المادية، بل <b class="k">مناخ العمل الجماعي</b> و<b class="k">الإشراف المشترك</b> (الشعور بالأهمية وسماع الآراء).</li>
   <li><b>النقد:</b> العينة محدودة ولا يمكن تعميم النتائج.</li>
   <li>تعتبر مدخلًا لـ<b>السلوك التنظيمي</b>.</li>
  </ul>
  <div class="ex">تذاكر أحسن مع مجموعة تحبها وأستاذ يسمع لك، حتى لو القاعة عادية.</div>`,
  q:[
   ["mc","المدرسة السلوكية جاءت كردة فعل على:",P(SH,0,[1]),"السلوكية ردّت على إهمال الكلاسيكية للجانب الإنساني."],
   ["mc","دراسات هوثورن قادها:",P(SC,3),"ألتون مايو وزملاؤه من هارفارد عام 1927."],
   ["mc","توصلت دراسات هوثورن إلى أن زيادة الإنتاجية سببها:",["مناخ العمل الجماعي والإشراف المشترك","الإضاءة الجيدة فقط","زيادة الأجور فقط","درجة الحرارة"],"ليست العوامل المادية، بل العلاقات الطيبة والشعور بالأهمية."],
   ["mc","انتُقدت تجربة هوثورن بسبب:",["محدودية العينة وعدم إمكانية تعميم النتائج","أنها اعتمدت على الأساليب الرياضية","أنها أهملت العلاقات الإنسانية","أنها أُجريت في المكاتب الحكومية"],"النقد: عينة صغيرة والنتائج لا تُعمَّم."]
  ]},
 {t:"هرم ماسلو للحاجات",h:`
  <p><b>إبراهام ماسلو.</b> الحاجة = عوز مادي أو نفسي يسعى الفرد لإشباعه. خمسة مستويات من الأسفل للأعلى:</p>
  <table class="t">
   <tr><td>5 (القمة)</td><td><b>تحقيق الذات</b>: التميز والإبداع والتفرد</td></tr>
   <tr><td>4</td><td><b>التقدير</b> والاحترام</td></tr>
   <tr><td>3</td><td><b>الاجتماعية</b> (الانتماء)</td></tr>
   <tr><td>2</td><td><b>الأمان</b>: الحماية من المخاطر ومن البطالة</td></tr>
   <tr><td>1 (القاعدة)</td><td><b>الفسيولوجية</b> (الأساسية): المأكل والمشرب والملبس</td></tr>
  </table>
  <p><b>مبدآن:</b> (1) الحاجة <b class="k">غير المشبعة</b> هي التي تولّد الدافع، والمشبعة لا تولّد دافعًا. (2) التدرج في الإشباع من <b class="k">أسفل إلى أعلى</b>.</p>
  <div class="tip">من تحت لفوق: أكل ← أمان ← أصحاب ← احترام ← إبداع.</div>`,
  q:[
   ["mc","صاحب نظرية الحاجات الإنسانية:",P(SC,4),"إبراهام ماسلو."],
   ["mc","قاعدة هرم ماسلو (أول حاجة يجب إشباعها):",["الحاجات الفسيولوجية","حاجات الأمان","حاجات التقدير","تحقيق الذات"],"القاعدة = الحاجات الأساسية: مأكل، مشرب، ملبس."],
   ["mc","الحماية من المخاطر ومن البطالة تمثل حاجات:",["الأمان","الفسيولوجية","الاجتماعية","تحقيق الذات"],"الأمن الشخصي والحماية من البطالة = حاجات الأمان."],
   ["tf","الحاجة المشبعة تولّد دافعًا لإشباعها.",false,"العكس: الحاجة غير المشبعة هي التي تولّد الدافع."],
   ["mc","قمة هرم ماسلو:",["تحقيق الذات","التقدير","الأمان","الحاجات الاجتماعية"],"القمة = التميز والإبداع = تحقيق الذات."]
  ]},
 {t:"نظرية X و Y والشخصية الناضجة",h:`
  <ul>
   <li><b>دوغلاس ماك جريجور</b>: نظرية <b class="k">X و Y</b>.</li>
   <li><b>X (سلبية):</b> العامل لا يحب العمل، لا يتحمل المسؤولية، بلا رقابة ذاتية، بلا طموح، يحب أن يكون تابعًا، يحفَّز بالمال فقط.</li>
   <li><b>Y (إيجابية):</b> عكس X تمامًا.</li>
   <li>أهم نتيجة: المدير يخلق بيئة عمل تتماشى مع <b>افتراضاته</b> عن العاملين، والعاملون يتصرفون وفقها.</li>
   <li><b>كريس آرجرس</b>: نظرية <b class="k">الشخصية الناضجة</b>: العامل الناضج مرن ومبدع، وهذا يتناقض مع الجمود الذي تفرضه الكلاسيكية.</li>
  </ul>
  <div class="tip">X = ✗ نظرة سلبية. Y = Yes نظرة إيجابية.</div>`,
  q:[
   ["mc","صاحب نظرية X و Y:",P(SC,5,[0,1]),"دوغلاس ماك جريجور."],
   ["mc","نظرية X تفترض أن العاملين:",["لا يحبون العمل ولا يرغبون في تحمل المسؤولية","يحبون العمل ويبدعون فيه","لديهم رقابة ذاتية عالية","طموحون ويحبون القيادة"],"X = الافتراضات السلبية. الخيارات الأخرى تخص Y."],
   ["mc","نظرية الشخصية الناضجة تعود إلى:",P(SC,6,[0,1,2]),"كريس آرجرس."]
  ]},
 {t:"المدرسة الكمية والمدارس الحديثة",h:`
  <ul>
   <li><b>الكمية:</b> الأساليب <b class="k">الرياضية والإحصائية</b> تساعد متخذ القرار. منها <b>علم الإدارة (بحوث العمليات)</b>.</li>
   <li><b>مدخل النظم:</b> المنظمة <b class="k">نظام مفتوح</b> على بيئته، يأخذ مدخلات ويحولها لمخرجات. إذا لم تفهم المنظمة بيئتها تصل إلى <b>التلاشي والاضمحلال</b>.</li>
   <li><b>المدخل الموقفي:</b> الإدارة <b class="k">حسب الموقف</b>. لا توجد نظرية تصلح لكل زمان ومكان.</li>
   <li><b>الخلاصة:</b> المدارس تتكامل، وكلها تبحث عن أفضل طريقة لإدارة المنظمة.</li>
  </ul>`,
  q:[
   ["mc","تستخدم الأساليب الرياضية والإحصائية لتحسين القرارات:",P(SH,2),"رياضيات وإحصاء = المدرسة الكمية."],
   ["mc","«لا توجد نظرية إدارية تصلح للتطبيق في كل زمان ومكان» هي فكرة:",P(SH,4,[0]),"المدخل الموقفي = الإدارة حسب الموقف."],
   ["mc","ينظر للمنظمة كنظام مفتوح يحوّل المدخلات إلى مخرجات:",P(SH,3,[0]),"مدخل النظم."]
  ]},
 {t:"الاتجاهات المعاصرة",h:`
  <ul>
   <li><b>البحث عن التميز:</b> خصائص تنفرد بها المنظمات الرائدة الناجحة.</li>
   <li><b>إدارة الجودة الشاملة:</b> الجودة <b class="k">مسؤولية جميع العاملين</b> من المدخلات حتى وصول المنتج للمستهلك.</li>
   <li><b>المنظمة المتعلمة:</b> تتحسن وتتغير باستمرار <b class="k">مستفيدة من خبراتها السابقة</b>.</li>
   <li>الوعي الشمولي والتنوع والمعرفة.</li>
   <li><b>القيادة الناجحة:</b> تفكير استراتيجي شمولي، إتقان التكنولوجيا، قيادة ملهمة، سلوك أخلاقي نموذجي.</li>
  </ul>`,
  q:[
   ["mc","فلسفة إدارية ترى أن الجودة مسؤولية جميع العاملين في المنظمة:",["إدارة الجودة الشاملة","المنظمة المتعلمة","البحث عن التميز","البيروقراطية"],"الجودة مسؤولية الجميع = إدارة الجودة الشاملة."],
   ["mc","المنظمة التي تتحسن وتتغير باستمرار مستفيدة من خبراتها السابقة:",["المنظمة المتعلمة","المنظمة الحكومية","المنظمة البيروقراطية","التعاونية"],"تتعلم من خبراتها = المنظمة المتعلمة."]
  ]}
 ],
 recall:[
  ["عدّد مدارس الإدارة.","الكلاسيكية، السلوكية، الكمية، الحديثة (النظم والموقفي)."],
  ["ما اتجاهات المدرسة الكلاسيكية وروادها؟","الإدارة العلمية (تايلور)، المبادئ الإدارية (فايول)، البيروقراطية (ماكس ويبر)."],
  ["اذكر أربعة من إسهامات تايلور.","قواعد علمية لكل وظيفة، اختيار العاملين بعناية، تدريبهم وربط الأجور بالأداء، مساعدتهم بالتخطيط السليم."],
  ["اذكر خمسة من مبادئ فايول.","تقسيم العمل، السلطة والمسؤولية، وحدة الأمر، وحدة الاتجاه، المركزية، العدالة، المبادرة، روح الفريق… (أي خمسة)."],
  ["عدّد مبادئ البيروقراطية.","تقسيم العمل، هيكلية واضحة للسلطة، قواعد وإجراءات رسمية مكتوبة، عدم التحيز، التدرج الوظيفي حسب الجدارة، فصل الإدارة عن الملكية."],
  ["رتّب حاجات ماسلو من الأسفل.","الفسيولوجية، الأمان، الاجتماعية، التقدير، تحقيق الذات."],
  ["ما نتيجة دراسات هوثورن؟","زيادة الإنتاجية لا تحكمها الظروف المادية، بل مناخ العمل الجماعي والإشراف المشترك."]
 ]},

{id:"c3",tab:"الفصل 3",name:"البيئة وثقافة المنظمة",icon:"🌍",secs:[
 {t:"بيئة المنظمة وأنواعها",h:`
  <p><b>البيئة:</b> كل العوامل الداخلية والخارجية التي تؤثر في نشاط المنظمة بشكل مباشر أو غير مباشر. والمنظمة <b>تتأثر وتؤثر</b> في بيئتها.</p>
  <table class="t"><tr><th>البيئة</th><th>عناصرها</th></tr>
   <tr><td><b>الداخلية</b> (داخل المنظمة)</td><td>العاملون، الملاك، مجلس الإدارة، الهيكل التنظيمي، الثقافة، البيئة المادية</td></tr>
   <tr><td><b>الخارجية الخاصة</b> (قريبة وتأثيرها مباشر)</td><td>المنافسون، الزبائن، الموردون، الشركاء الاستراتيجيون، المشرّعون</td></tr>
   <tr><td><b>الخارجية العامة</b> (بعيدة وتأثيرها على الجميع)</td><td>الاقتصادية، الاجتماعية والثقافية، القانونية والسياسية، التكنولوجية، الطبيعية، الدولية</td></tr>
  </table>
  <div class="ex">مطعم: الطباخ (داخلية)، المطعم اللي جنبه والزباين (خارجية خاصة)، ارتفاع الأسعار في البلد (خارجية عامة).</div>
  <div class="tip">الخاصة = ناس تتعامل معهم المنظمة مباشرة. العامة = «قوى» كبيرة تنتهي غالبًا بـ«ية».</div>`,
  q:[
   ["mc","المنافسون والزبائن والموردون من عناصر:",P(EN,1),"جهات تتعامل معها المنظمة مباشرة = خارجية خاصة."],
   ["mc","العاملون والملاك والهيكل التنظيمي والثقافة من عناصر:",P(EN,0),"كلها داخل المنظمة."],
   ["mc","القوى الاقتصادية والتكنولوجية والقانونية والسياسية من عناصر:",P(EN,2),"قوى كبيرة تؤثر على الجميع = خارجية عامة."],
   ["mc","أي مما يلي من البيئة الخارجية <u>العامة</u>؟",["البعد الدولي","الموردون","مجلس الإدارة","الزبائن"],"الموردون والزبائن خاصة، ومجلس الإدارة داخلية."],
   ["tf","المنظمات تتأثر بالبيئة لكنها لا تؤثر فيها.",false,"المنظمات أنظمة مفتوحة: تتأثر وتؤثر."]
  ]},
 {t:"العلاقة بين البيئة والمنظمة",h:`
  <ul>
   <li><b>المنظمة مطالَبة</b> بفهم عناصر البيئة، واكتساب <b class="k">ميزة تنافسية</b> تضمن بقاءها.</li>
   <li><b>البيئة تتميز بـ:</b> <b class="k">التعقيد، الديناميكية، عدم التأكد</b>.</li>
   <li><b>مميزات منظمات الأعمال الحديثة:</b> الالتزام بخدمة <b>الزبائن</b>، الالتزام بـ<b>الجودة</b> (منتج مطابق للمعايير العالمية)، توظيف <b>التكنولوجيا</b> لخدمة الجودة.</li>
  </ul>`,
  q:[
   ["mc","البيئة تتميز بـ:",["التعقيد والديناميكية وعدم التأكد","البساطة والثبات والوضوح","الثبات والتأكد التام","السهولة والاستقرار"],"ثلاث صفات: تعقيد، ديناميكية (تغيّر)، عدم تأكد."],
   ["mc","تقديم منتج مطابق للمواصفات والمعايير العالمية يعني:",["الالتزام بالجودة","الالتزام بخدمة الزبائن","التنوع الثقافي","العولمة"],"المطابقة للمواصفات = الجودة."]
  ]},
 {t:"ثقافة المنظمة",h:`
  <p><b>ثقافة المنظمة:</b> نظم <b class="k">القيم والمعتقدات</b> التي يتقاسمها أعضاء التنظيم وتوجّه سلوك الفرد.</p>
  <p><b>أهميتها = كلمة HOME:</b></p>
  <table class="t">
   <tr><td><b>H</b>istory</td><td>بناء الحس <b>التاريخي</b></td></tr>
   <tr><td><b>O</b>neness</td><td>إيجاد شعور <b>بالتوحيد</b></td></tr>
   <tr><td><b>M</b>embership</td><td>الإحساس <b>بالعضوية والانتماء</b></td></tr>
   <tr><td><b>E</b>xchange</td><td>زيادة <b>التبادل</b> بين الأعضاء</td></tr>
  </table>
  <p><b>عناصرها:</b> الثقافة الجوهرية (قيم ومعتقدات) في المركز، وحولها: <b class="k">الرموز، الأبطال، القصص والحكايات، الطقوس والشعائر</b>.</p>
  <div class="tip">الثقافة تجعل المنظمة مثل البيت: HOME.</div>`,
  q:[
   ["mc","نظم القيم والمعتقدات التي يتقاسمها أعضاء التنظيم وتوجّه سلوك الفرد:",["ثقافة المنظمة","البيئة الخارجية","الهيكل التنظيمي","العولمة"],"قيم ومعتقدات مشتركة = ثقافة المنظمة."],
   ["mc","حرف M في كلمة HOME يدل على:",["العضوية والانتماء","الحس التاريخي","التوحيد","التبادل"],"M = Membership = العضوية والانتماء."],
   ["mc","حرف H في كلمة HOME يدل على:",["بناء الحس التاريخي","زيادة التبادل","الشعور بالتوحيد","العضوية"],"H = History = التاريخ."],
   ["mc","أي مما يلي <u>ليس</u> من عناصر ثقافة المنظمة؟",["الموردون","الرموز","الأبطال","الطقوس والشعائر"],"الموردون من البيئة الخارجية الخاصة."]
  ]},
 {t:"التنوع الثقافي",h:`
  <p><b>التنوع:</b> الاختلافات بين الأفراد في المنظمة: العمر، الجنس، العرق، الدين، القدرة الجسمية، التوجهات…</p>
  <p><b>إيجابياته (4):</b></p>
  <ul>
   <li><b>التعددية:</b> الجميع يساهم في وضع السياسات.</li>
   <li><b>التكامل الهيكلي:</b> الأقليات ممثلة في كل المستويات.</li>
   <li><b>غياب الحكم المسبق والتمييز.</b></li>
   <li><b>أقل ما يمكن من النزاعات.</b></li>
  </ul>
  <p><b>مخاطره:</b> الحكم المسبق، <b class="k">السقف الزجاجي</b>، الجدران الزجاجية، القوالب الجاهزة، الفردانية، الثقافة الثنائية، صراع الأدوار، تضخيم الأدوار، التحرش. ونتيجتها: تأثر السلوك، تراجع الأداء، الصراعات.</p>`,
  q:[
   ["mc","الاختلافات بين الأفراد من حيث العمر أو الجنس أو العرق أو الدين تسمى:",["التنوع","العولمة","الثقافة الجوهرية","التكامل الهيكلي"],"هذا تعريف التنوع."],
   ["mc","من إيجابيات التنوع الثقافي:",["التعددية","السقف الزجاجي","الحكم المسبق","صراع الأدوار"],"الثلاثة الأخرى من المخاطر."],
   ["mc","أي مما يلي من مخاطر التنوع الثقافي؟",["السقف الزجاجي","التكامل الهيكلي","التعددية","غياب التمييز"],"السقف الزجاجي من المخاطر، والبقية إيجابيات."],
   ["mc","«الأقليات ممثلة في كل المستويات» يعني:",["التكامل الهيكلي","التعددية","الفردانية","الثقافة الثنائية"],"تمثيل الأقليات في المستويات = تكامل هيكلي."]
  ]},
 {t:"العولمة",h:`
  <p><b>العولمة:</b> تزايد التداخلات والارتباطات بين عناصر الاقتصاد العالمي بسبب <b class="k">تطور تكنولوجيا المعلومات</b>. وهي تشمل <b>كل جوانب الحياة</b> وليس الاقتصاد فقط.</p>
  <p><b>نتائجها:</b> علاقات اقتصادية متشابكة، مجال واسع للتزود بالموارد، زيادة المخاطر التنافسية، الحاجة إلى الإدارة الدولية.</p>
  <p><b>تطور الأعمال:</b></p>
  <div class="flow"><span>محلية</span><i>←</i><span>دولية</span><i>←</i><span>متعددة الجنسيات</span><i>←</i><span>عالمية</span></div>`,
  q:[
   ["mc","السبب الرئيسي في العولمة:",["تطور تكنولوجيا المعلومات","زيادة عدد السكان","قلة الموارد الطبيعية","ضعف المنافسة"],"التعريف: «بفعل تطور تكنولوجيا المعلومات»."],
   ["mc","الترتيب الصحيح لتطور الأعمال:",["محلية ← دولية ← متعددة الجنسيات ← عالمية","محلية ← عالمية ← دولية ← متعددة الجنسيات","دولية ← محلية ← عالمية ← متعددة الجنسيات","عالمية ← متعددة الجنسيات ← دولية ← محلية"],"تبدأ محلية وتكبر حتى تصير عالمية."],
   ["tf","العولمة تقتصر على الاقتصاد فقط.",false,"العولمة تشمل جميع جوانب الحياة."]
  ]},
 {t:"بيئة الأعمال الدولية",h:`
  <table class="t"><tr><th>البعد</th><th>فيه</th></tr>
   <tr><td><b>السياسي-القانوني</b></td><td>المخاطرة السياسية، القوانين والقيود، هيمنة الحكومة (<b class="k">التأميم</b>)، الرسوم والضرائب والحصص</td></tr>
   <tr><td><b>الاقتصادي</b></td><td>التطور الاقتصادي، الأسواق، التكاليف</td></tr>
   <tr><td><b>الثقافي الاجتماعي</b></td><td>القيم والمعتقدات، الدين، مستوى التعلم</td></tr>
  </table>
  <p><b>أنماط الأعمال الدولية:</b></p>
  <ul>
   <li><b>استراتيجيات الدخول إلى الأسواق العالمية:</b> الاستيراد، التصدير، التراخيص والامتياز.</li>
   <li><b>استراتيجيات الاستثمار المباشر:</b> المشاريع المشتركة، الفروع المستقلة.</li>
  </ul>
  <div class="tip">الدخول = تبيع وتشتري من بعيد. الاستثمار المباشر = تفتح هناك (مشروع مشترك أو فرع).</div>`,
  q:[
   ["mc","المخاطرة السياسية والقوانين والقيود والتأميم تتبع البعد:",["السياسي-القانوني","الاقتصادي","الثقافي الاجتماعي","التكنولوجي"],"قوانين + حكومة = سياسي قانوني."],
   ["mc","القيم الاجتماعية والدين ومستوى التعلم تتبع البعد:",["الثقافي الاجتماعي","الاقتصادي","السياسي-القانوني","الطبيعي"],"قيم + دين + تعليم = ثقافي اجتماعي."],
   ["mc","المشاريع المشتركة والفروع المستقلة من:",["استراتيجيات الاستثمار المباشر","استراتيجيات الدخول إلى الأسواق العالمية","عناصر ثقافة المنظمة","مخاطر التنوع الثقافي"],"تفتح في البلد الآخر = استثمار مباشر."],
   ["mc","الاستيراد والتصدير والتراخيص والامتياز من:",["استراتيجيات الدخول إلى الأسواق العالمية","استراتيجيات الاستثمار المباشر","أبعاد البيئة الداخلية","إيجابيات التنوع"],"هذه طرق الدخول للأسواق العالمية."]
  ]}
 ],
 recall:[
  ["عرّف البيئة.","مختلف العوامل والمتغيرات الداخلية والخارجية التي تؤثر في نشاط المنظمة بصفة مباشرة وغير مباشرة."],
  ["عدّد عناصر البيئة الخارجية الخاصة.","المنافسون، الزبائن، الموردون، الشركاء الاستراتيجيون، المشرّعون."],
  ["عدّد عناصر البيئة الخارجية العامة.","الاقتصادية، الاجتماعية والثقافية، القانونية والسياسية، التكنولوجية، الطبيعية، الدولية."],
  ["عرّف ثقافة المنظمة واذكر عناصرها.","نظم القيم والمعتقدات التي يتقاسمها أعضاء التنظيم وتوجّه السلوك. عناصرها: الثقافة الجوهرية، الرموز، الأبطال، القصص والحكايات، الطقوس والشعائر."],
  ["ماذا تعني HOME؟","History الحس التاريخي، Oneness التوحيد، Membership العضوية والانتماء، Exchange التبادل."],
  ["عدّد أبعاد بيئة الأعمال الدولية.","السياسي-القانوني، الاقتصادي، الثقافي الاجتماعي."]
 ]},

{id:"c4",tab:"الفصل 4",name:"اتخاذ القرارات وتكنولوجيا المعلومات",icon:"🎯",secs:[
 {t:"تأثير تكنولوجيا المعلومات",h:`
  <ul>
   <li>المنظمات صارت أكثر <b>شفافية وانفتاحًا</b>، وظهر <b class="k">العاملون المعرفيون</b> (رأس المال المعرفي).</li>
   <li><b>قابليات حاسوبية:</b> القدرة على استخدام <b>الحواسيب</b> لخلق الميزة.</li>
   <li><b>قابليات معلوماتية:</b> القدرة على استخدام التكنولوجيا في <b class="k">اتخاذ القرارات</b>.</li>
   <li>قلّلت عدد المستويات الإدارية ← <b class="k">تنظيم مسطّح (مفلطح)</b>، وقلّ عدد المديرين.</li>
   <li><b>التجارة الإلكترونية:</b> الشراء والبيع وعقد الصفقات عبر الإنترنت.</li>
   <li><b>المكاتب المؤتمتة</b> (المحطات الذكية): حواسيب مربوطة ببعضها لتسهيل العمل.</li>
   <li>على العملية الإدارية: عزّزت أدوار المديرين (سرعة الاتصالات، وضوح الأهداف، القياس السريع للنتائج).</li>
  </ul>`,
  q:[
   ["mc","تكنولوجيا المعلومات جعلت التنظيم:",["مسطّحًا (قلّلت عدد المستويات الإدارية)","أطول (زادت المستويات الإدارية)","أكثر انغلاقًا","بلا مديرين نهائيًا"],"الحاسب يقوم بجزء من نقل المعلومات، فقلّت المستويات وصار التنظيم مسطّحًا."],
   ["mc","القدرة على استخدام التكنولوجيا في اتخاذ القرارات تسمى:",["قابليات معلوماتية","قابليات حاسوبية","مهارات فنية","تجارة إلكترونية"],"معلوماتية = اتخاذ القرارات. حاسوبية = استخدام الحواسيب لخلق الميزة."],
   ["mc","الشراء والبيع وعقد الصفقات عبر الإنترنت:",["التجارة الإلكترونية","المكاتب المؤتمتة","التنظيم المسطح","بحوث العمليات"],"هذا تعريف التجارة الإلكترونية."]
  ]},
 {t:"ما هو القرار؟",h:`
  <p><b>القرار:</b> <b class="k">اختيار بديل أمثل من عدة بدائل</b> متاحة لتحقيق هدف معين.</p>
  <p><b>أركانه الثلاثة:</b> وجود <b>البدائل</b>، <b>حرية الاختيار</b>، وجود <b>الهدف</b> (وإلا صار القرار عملًا عبثيًا).</p>
  <ul>
   <li>القرارات <b>جوهر العملية الإدارية</b>.</li>
   <li><b>صناعة القرار:</b> تشخيص المشكلة، جمع البيانات، تطوير البدائل وتقييمها، والتوصية بأفضلها.</li>
   <li><b>اتخاذ القرار:</b> تقييم البدائل، اختيار أفضلها، تنفيذه وتقييمه.</li>
  </ul>
  <div class="ex">تختار جوال: عندك عدة أنواع (بدائل)، أنت حر تختار (حرية)، وتبي جوال بكاميرا قوية (هدف).</div>
  <div class="tip">الأركان: بدائل + حرية + هدف.</div>`,
  q:[
   ["mc","القرار هو:",["اختيار بديل أمثل من عدة بدائل متاحة لتحقيق هدف معين","تنفيذ أوامر الإدارة العليا","قياس الأداء ومقارنته بالمخطط","تقسيم العمل بين الأقسام"],"هذا تعريف القرار نصًا."],
   ["mc","أي مما يلي <u>ليس</u> من أركان القرار الثلاثة؟",["وجود ميزانية كبيرة","وجود البدائل","حرية الاختيار","وجود الهدف"],"الأركان: بدائل، حرية اختيار، هدف."],
   ["tf","القرار بدون هدف يصبح عملًا عبثيًا.",true,"وجود الهدف ركن أساسي، وبدونه يصبح القرار عبثيًا."]
  ]},
 {t:"مراحل صناعة واتخاذ القرار (8)",h:`
  <ol>
   <li><b>إدراك متطلبات القرار</b>: وجود <b class="k">مشكلة</b> (فشل في إنجاز الأهداف) أو <b class="k">فرصة</b> (إنجاز يتجاوز الأهداف).</li>
   <li><b>تشخيص وتحليل الأسباب.</b></li>
   <li><b>تطوير البدائل</b>: البحث عن الحلول.</li>
   <li><b>تقييم البدائل</b>: أيها أفضل؟ (التكلفة، التوقيت، قبول المعنيين، الجوانب الأخلاقية).</li>
   <li><b>اختيار البديل المناسب</b> (القرار الأمثل).</li>
   <li><b>تنفيذ البديل المختار.</b></li>
   <li><b>التقييم والتغذية العكسية.</b></li>
   <li><b>إجراء التصحيحات</b> أو إقرار النتائج وتوثيقها.</li>
  </ol>
  <p><b>أخطاء شائعة في المرحلة الأولى:</b> تعريف المشكلة بشكل واسع جدًا أو ضيق جدًا، التركيز على <b>الأعراض</b> وليس الأسباب، اختيار مشكلة خاطئة.</p>
  <div class="tip">مثل الطبيب: يحس بالمشكلة ← يشخّص ← يشوف العلاجات ← يقارن ← يختار ← يعطي الدواء ← يتابع ← يعدّل.</div>`,
  q:[
   ["mc","أول مرحلة من مراحل صناعة القرار:",P(ST,0),"تبدأ بإدراك أن هناك مشكلة أو فرصة."],
   ["mc","موقف تفشل فيه المنظمة في إنجاز أهدافها يسمى:",["مشكلة","فرصة","أزمة","بديل"],"فشل في الأهداف = مشكلة. تجاوز الأهداف = فرصة."],
   ["mc","البحث عن الحلول للمشكلة هو مرحلة:",P(ST,2,[0]),"البحث عن حلول = تطوير البدائل."],
   ["mc","التكلفة والتوقيت وقبول المعنيين والجوانب الأخلاقية اعتبارات تستخدم في:",P(ST,3,[0,1]),"هذه معايير المقارنة بين البدائل = تقييم البدائل."],
   ["mc","آخر مرحلة من مراحل القرار:",[ST[7],ST[5],ST[4],ST[0]],"بعد التقييم نصحّح أو نقرّ النتائج ونوثّقها."],
   ["mc","من أخطاء المديرين في مرحلة إدراك المشكلة:",["التركيز على الأعراض وليس الأسباب","تقييم البدائل بالتكلفة","توثيق النتائج","مشاركة المرؤوسين"],"من الأخطاء: التركيز على الأعراض، وتعريف المشكلة بشكل واسع أو ضيق جدًا."]
  ]},
 {t:"أنواع القرارات",h:`
  <table class="t"><tr><th></th><th>مبرمجة</th><th>غير مبرمجة</th></tr>
   <tr><td>ما هي</td><td><b class="k">حلول جاهزة</b> من خبرة سابقة</td><td>حلول <b class="k">خاصة</b> جديدة</td></tr>
   <tr><td>المشكلة</td><td>روتينية، واضحة، مهيكلة</td><td>غامضة، ناقصة المعلومات، غير مهيكلة</td></tr>
   <tr><td>المخاطرة</td><td>قليلة</td><td>عالية</td></tr>
   <tr><td>المستوى</td><td>الأدنى والأوسط</td><td>الإدارة <b>العليا</b></td></tr>
  </table>
  <ul>
   <li><b>الأزمة:</b> موقف حرج غير متوقع قد يقود إلى كارثة إذا لم يعالج بسرعة. قراراتها أصعب القرارات غير المبرمجة.</li>
   <li>تصنيف آخر: استراتيجية (غير مبرمجة عادةً)، تكتيكية، تشغيلية.</li>
  </ul>
  <div class="ex">طالب غاب ← نطبق لائحة الغياب (مبرمج). حريق في المبنى ← قرار جديد وسريع (غير مبرمج / أزمة).</div>`,
  q:[
   ["mc","حلول جاهزة من واقع خبرة سابقة لحل مشاكل روتينية:",["القرارات المبرمجة","القرارات غير المبرمجة","القرارات الاستراتيجية","قرارات الأزمة"],"جاهزة + روتينية = مبرمجة."],
   ["mc","القرارات غير المبرمجة تُتخذ غالبًا على مستوى:",P(LV,0,[3]),"لأنها غامضة وعالية المخاطرة وتخص التغيرات في البيئة الخارجية."],
   ["mc","موقف حرج غير متوقع قد يقود إلى كارثة إذا لم يُعالج بسرعة:",["الأزمة","الفرصة","القرار المبرمج","التحالف"],"هذا تعريف الأزمة."]
  ]},
 {t:"ظروف اتخاذ القرار (4)",h:`
  <table class="t"><tr><th>الحالة</th><th>اعرفها من</th></tr>
   <tr><td><b>التأكد التام</b></td><td><b class="k">معرفة تامة</b>، قرارات مبرمجة، نسبة نجاح عالية</td></tr>
   <tr><td><b>المخاطرة</b></td><td>يعرف <b class="k">الاحتمالات</b> (موضوعية أو شخصية)، الأهداف واضحة لكن المعلومات غير كاملة</td></tr>
   <tr><td><b>عدم التأكد</b></td><td><b class="k">لا يعرف الاحتمالات</b>، نقص كبير في المعلومات</td></tr>
   <tr><td><b>الإبهام</b> (الغموض التام)</td><td>حتى <b class="k">الأهداف غير واضحة</b>، والبدائل صعبة التحديد. تسمى «المواقف الشريرة»</td></tr>
  </table>
  <div class="tip">كلما نزلت في الجدول قلّت المعلومات: أعرف كل شيء ← أعرف الاحتمالات ← ما أعرف الاحتمالات ← ما أعرف حتى الهدف.</div>`,
  q:[
   ["mc","المعرفة التامة لدى المقرر بحالات الطبيعة:",P(CO,0),"معرفة تامة = تأكد تام."],
   ["mc","يعرف متخذ القرار احتمالية حدوث الحالات، والأهداف واضحة لكن المعلومات غير كاملة:",P(CO,1),"يعرف الاحتمالات = مخاطرة."],
   ["mc","الأهداف غير واضحة والمعلومات غير متوفرة والبدائل صعبة التحديد («المواقف الشريرة»):",P(CO,3),"حتى الأهداف غير واضحة = الإبهام."],
   ["mc","لا يعرف المقرر احتمالية حدوث الحالات ويوجد نقص كبير في المعلومات:",P(CO,2),"لا يعرف الاحتمالات = عدم التأكد."]
  ]},
 {t:"نماذج صناعة القرار (3)",h:`
  <table class="t"><tr><th>النموذج</th><th>اعرفه من</th></tr>
   <tr><td><b>التقليدي (الكلاسيكي)</b></td><td>رشد وعقلانية، <b class="k">معلومات كاملة</b>، قرارات <b class="k">مثلى</b>، حالة التأكد والمخاطرة. نقده: غير واقعي</td></tr>
   <tr><td><b>السلوكي</b></td><td><b class="k">رشد محدود</b>، معلومات جزئية، قرارات <b class="k">مرضية</b> (أول حل مقبول يظهر)، حالة عدم التأكد</td></tr>
   <tr><td><b>السياسي</b></td><td><b class="k">تحالفات</b> بين المديرين، أهداف متعددة ومتعارضة، مساومات وحوار، عدم تأكد وإبهام. الأقرب للواقع</td></tr>
  </table>
  <p><b>التحالفات:</b> تجمعات غير رسمية بين مديرين يدعمون هدفًا محددًا.</p>
  <p><b>طرق التفكير:</b> منهجي منظم (تحليلي رشيد)، حدسي (مرن وعفوي)، متعدد الأبعاد (يوازن بينهما).</p>
  <div class="tip">كلاسيكي = مثلى. سلوكي = مرضية. سياسي = تحالفات.</div>`,
  q:[
   ["mc","النموذج الذي يفترض معلومات كاملة ويصنع قرارات «مثلى»:",P(MO,0),"معلومات كاملة + قرارات مثلى = الكلاسيكي."],
   ["mc","القرارات «المرضية» والرشد المحدود تخص:",P(MO,1),"رشد محدود + قرارات مرضية = السلوكي."],
   ["mc","يعتمد على تشكيل تحالفات بين المديرين:",P(MO,2),"تحالفات = السياسي."],
   ["mc","انتُقد النموذج الكلاسيكي بأنه:",["غير واقعي لمحدودية قدرة الإنسان على جمع المعلومات","يعتمد على التحالفات","يهمل الأرباح","يصلح للأزمات فقط"],"لا أحد يملك معلومات كاملة في الواقع."]
  ]},
 {t:"المشاركة والقرار الجماعي",h:`

function answer(btn){
  var qe=btn.closest(".q");if(qe.classList.contains("lock"))return;
  var q=Q[qe.dataset.id], o=+btn.dataset.o, isMock=qe.dataset.mode==="mock", why=$(".why",qe), again=$(".again",qe);
  function reveal(){qe.classList.add("lock");[].forEach.call(qe.querySelectorAll(".opt"),function(b){b.disabled=true;if(+b.dataset.o===q.correct)b.classList.add("ok");});why.hidden=false;again.hidden=true;}
  if(o===q.correct){
    btn.classList.add("ok");reveal();
    if(isMock){mock.right++;mock.by[q.ch]++;$("#mnext").hidden=false;}
    else{var c=CH[q.ch],before=chDone(c);S.done[q.id]=1;save();drawTabs();streak++;
      if(before<c.qs.length&&chDone(c)===c.qs.length){confetti();toast("🎉 خلّصت "+c.tab+" كامل!");}
      else if(streak>0&&streak%3===0)toast(streak+" صح ورا بعض! "+CHEER[(streak/3)%4|0]);}
  }else{
    btn.classList.add("no");btn.disabled=true;streak=0;
    if(isMock){mock.wrong.push(q.id);why.classList.add("bad");why.innerHTML="📌 الصحيح: <b>"+q.opts[q.correct]+"</b><br>"+q.why;reveal();$("#mnext").hidden=false;}
    else{tries[q.id]=(tries[q.id]||0)+1;
      if(q.tf||tries[q.id]>=2){why.classList.add("bad");why.innerHTML="📌 الصحيح: <b>"+q.opts[q.correct]+"</b><br>"+q.why+"<br><small>بيرجع لك هذا السؤال لما تفتح الفصل مرة ثانية.</small>";reveal();tries[q.id]=0;}
      else again.hidden=false;}
  }
}
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-tab]");if(t){go(t.dataset.tab);return;}
  var o=e.target.closest(".opt");if(o){answer(o);return;}
  var f=e.target.closest(".fc");if(f){f.classList.toggle("f");return;}
  if(e.target.id==="mstart"){mockBegin();return;}
  if(e.target.id==="mnext"){mock.i++;if(mock.i>=mock.list.length)mockEnd();else mockShow();}
});
document.addEventListener("input",function(e){if(e.target.id==="nm"){S.name=e.target.value.trim().slice(0,30);save();}});
go("home");
</script>
</body>
</html>
